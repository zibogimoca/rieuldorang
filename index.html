<script type="text/javascript">
(function () {
  var preload = document.getElementById("preloader");
  var ANIM = 1700; /* logo fully drawn (~1.3s) plus a short hold, in ms */
  var start = Date.now();
  var done = false;
  function hide() {
    if (done || !preload) return;
    done = true;
    var elapsed = Date.now() - start;
    var wait = Math.max(0, ANIM - elapsed);
    setTimeout(function () {
      preload.classList.add("hidden");
      setTimeout(function () { preload.style.display = "none"; }, 600);
    }, wait);
  }
  if (document.readyState === "complete") { hide(); }
  else { window.addEventListener("load", hide); }
  setTimeout(hide, 5000);
})();
</script>
<style>
  #preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 999;
    background: #FFFFFF;
    opacity: 1;
    transition: opacity 0.5s ease-out;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #preloader.hidden { opacity: 0; }
  /* Vector logo: sharp at any size and pixel density */
  #rdLogo { width: min(200px, 42vw); height: auto; display: block; }
  #rdLogo .rdMark { opacity: 0; animation: rdFade 0.5s ease-out forwards; }
  #rdLogo .rdWord path { opacity: 0; animation: rdFade 0.12s linear forwards; animation-delay: calc(0.35s + var(--i) * 0.085s); }
  @keyframes rdFade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #rdLogo .rdMark, #rdLogo .rdWord path { animation: none; opacity: 1; }
  }
</style>
